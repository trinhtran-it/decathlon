version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USERNAME:?set in .env (see .env.example)}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:?set in .env (see .env.example)}
    networks:
      - retail-network

  retail-product-vietnam:
    build:
      context: ./RetailProductVietnam
      dockerfile: Dockerfile
    container_name: retail-product-vietnam
    ports:
      - "3001:3001"
    environment:
      - MONGODB_URI=mongodb://${MONGO_ROOT_USERNAME:?set in .env}:${MONGO_ROOT_PASSWORD:?set in .env}@mongodb:27017/retail-product-vietnam?authSource=admin
      - RETAIL_STOCK_UNITED_API_URL=http://retail-stock-united:8080/api/v1
      - RETAIL_STOCK_UNITED_API_KEY=${RETAIL_STOCK_UNITED_API_KEY:?set in .env (see .env.example)}
      - PORT=3001
    depends_on:
      - mongodb
      - retail-stock-united
    networks:
      - retail-network

  retail-stock-united:
    build:
      context: ./RetailStockUnited
      dockerfile: Dockerfile
    container_name: retail-stock-united
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/retailstockunited
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?set in .env}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      SPRING_PROFILES_ACTIVE: docker
      API_KEY: ${RETAIL_STOCK_UNITED_API_KEY:?set in .env}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - retail-network

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: retailstockunited
      POSTGRES_USER: ${POSTGRES_USER:?set in .env (see .env.example)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env (see .env.example)}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - retail-network

  apac-website:
    build:
      context: ./APACWebsite
      dockerfile: Dockerfile
    container_name: apac-website
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://retail-product-vietnam:3001/api/v1
    depends_on:
      - retail-product-vietnam
    networks:
      - retail-network

volumes:
  postgres_data:
    driver: local
  mongodb_data:
    driver: local

networks:
  retail-network:
    driver: bridge
