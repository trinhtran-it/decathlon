# Server Configuration
server.port=8080

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/retailstockunited
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
# Required: no default, so the app fails fast instead of using a guessable password
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Transaction Configuration
spring.transaction.default-timeout=10
# Pessimistic lock timeout (in ms) - how long a transaction should wait for a lock
spring.jpa.properties.jakarta.persistence.lock.timeout=5000

# API Key for Security
# Required: set API_KEY in the environment (docker-compose passes it from .env)
api.key=${API_KEY}

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.com.retailstock.retailstockunited=DEBUG

# Springdoc OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.disable-swagger-default-url=true

# Enable Swagger UI
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true